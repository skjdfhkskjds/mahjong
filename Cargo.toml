[workspace]
members = ["backend", "backend/crates/engine", "backend/crates/pubsub", "backend/crates/rulesets", "backend/crates/server", "backend/crates/tasks", "xtask"]
resolver = "3"

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.97.1"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
